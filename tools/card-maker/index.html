<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文字の画面メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f150f;--night:#1b1511;--night2:#2c221b;--night3:#3d3026;--cream:#f0e4cc;--dim:#b0a088;--parka:#b0422e;--gold:#c9a35a;
--font:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--cream);font-family:var(--font);overflow-x:hidden}
body.headless{background:#000}
body.headless .ui{display:none}
body.headless canvas{width:1080px!important;height:1920px!important;border:0;border-radius:0;box-shadow:none;max-width:none}
.app{display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:24px;padding:20px;max-width:1200px;margin:0 auto}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr);padding:12px 16px}}
.app>*{min-width:0}
.stage{position:sticky;top:12px;align-self:start;text-align:center}
@media (max-width:820px){.stage{position:static}}
canvas{width:100%;max-width:420px;aspect-ratio:9/16;height:auto;border:3px solid var(--ink);border-radius:18px;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media (max-width:820px){canvas{max-width:280px}}
.play{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
h1{font-size:20px;margin:0 0 4px;font-weight:900}
h1 small{display:block;font-size:12px;color:var(--dim);font-weight:700}
.card{background:var(--night2);border:2px solid var(--ink);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:14px;margin:0 0 10px;color:var(--gold)}
label{font-size:12px;color:var(--dim);display:block;margin:8px 0 4px}
input[type=text],input[type=number],textarea{width:100%;background:var(--night);color:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:16px}
textarea{min-height:90px}
textarea.json{min-height:110px;font-size:13px;font-family:ui-monospace,monospace}
.seg{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-width:0;border:0;border-radius:0;background:var(--night);color:var(--dim);padding:10px 6px;font-size:13px}
.seg button.on{background:var(--parka);color:var(--cream)}
button{background:var(--night3);color:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
button.main{background:var(--parka)}
button.ghost{background:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12px;color:var(--dim);line-height:1.6}
.status{font-size:13px;color:var(--gold);min-height:1.4em;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.only{display:none}
body[data-type="text"] .only.text, body[data-type="quote"] .only.quote, body[data-type="rx"] .only.rx{display:block}
</style>
</head>
<body data-type="text">
<div class="app">
  <div class="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div class="play ui">
      <button class="main" id="btnPlay">▶ 再生</button>
      <button id="btnVideo">動画で保存</button>
      <button id="btnPng">画像で保存</button>
    </div>
    <div class="status ui" id="status"></div>
  </div>
  <div class="ui">
    <h1>文字の画面メーカー<small>バックボーン（S5）・名言（S7）・処方箋（S8）の画面を作ります</small></h1>
    <div class="card">
      <div class="seg" id="seg">
        <button data-t="text">バックボーン</button><button data-t="quote">名言</button><button data-t="rx">処方箋</button>
      </div>
      <label>長さ（秒）</label><input type="number" id="dur" step="0.5" min="2">
    </div>

    <div class="card only text">
      <h2>バックボーン（黒い画面に1行ずつ）</h2>
      <label>文（改行で1行ずつ出ます。赤くしたい言葉は【 】で囲む）</label><textarea id="lines"></textarea>
      <label>小さく出す出典・注記</label><input type="text" id="source">
    </div>

    <div class="card only quote">
      <h2>名言</h2>
      <label>名言（改行可。赤くしたい言葉は【 】で囲む）</label><textarea id="quote"></textarea>
      <label>だれの言葉か</label><input type="text" id="who">
      <label>出典（作品名・年など）</label><input type="text" id="qsrc">
    </div>

    <div class="card only rx">
      <h2>処方箋</h2>
      <div class="g2"><div><label>No.</label><input type="text" id="no"></div><div><label>患者</label><input type="text" id="patient"></div></div>
      <label>今週の処方（映画のタイトル）</label><input type="text" id="title">
      <label>用量</label><input type="text" id="dose">
      <label>副作用</label><input type="text" id="side">
      <label>医師のひと言（じょんどぅー）</label><input type="text" id="doc">
    </div>

    <div class="card">
      <h2>保存・読み込み（制作パイプライン用）</h2>
      <textarea class="json" id="json"></textarea>
      <div class="row"><button id="btnCopy">JSONをコピー</button><button id="btnLoad">読み込む</button><button class="ghost" id="btnReset">初期状態</button></div>
    </div>
  </div>
</div>
<script>
const CM=(()=>{
  const W=1080,H=1920;
  const SANS='"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans",sans-serif', SERIF='"Noto Serif JP","Noto Serif CJK JP","Hiragino Mincho ProN",serif';
  const font=(w,px,s)=>`${w} ${px}px ${s?SERIF:SANS}`;
  const C={ink:"#1f150f",cream:"#f0e4cc",dim:"#b0a088",red:"#c4462f",paper:"#f4ecd6",brown:"#786048",line:"#d6c8aa"};
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), ease=t=>1-Math.pow(1-clamp(t),3), prog=(t,s,d)=>clamp((t-s)/d);
  const IM={}; let paper=null, grain=null;
  const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});
  async function ready(){
    if(!IM.doc) IM.doc=await load("../../assets/characters/johndoe/doctor_stand.png");
    if(!paper){ paper=document.createElement("canvas"); paper.width=W; paper.height=H; const x=paper.getContext("2d"); x.fillStyle=C.paper; x.fillRect(0,0,W,H);
      let s=5; const r=()=>{s=(s*16807)%2147483647;return s/2147483647;}; for(let i=0;i<9000;i++){x.fillStyle=`rgba(120,100,70,${r()*.05})`;x.fillRect(r()*W,r()*H,2+r()*3,2+r()*3);} }
    if(!grain){ grain=document.createElement("canvas"); grain.width=W/2; grain.height=H/2; const x=grain.getContext("2d"); let s=9; const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};
      for(let i=0;i<20000;i++){x.fillStyle=`rgba(255,240,220,${r()*.05})`;x.fillRect(r()*W/2,r()*H/2,1.5,1.5);} }
    try{ await document.fonts.load(font(900,60)); await document.fonts.load(font(900,60,true)); await document.fonts.ready; }catch(e){}
  }
  // 【】で囲んだ所を赤にする。1行を「部分」の配列に
  const parts=s=>{ const out=[]; let red=false,buf=""; for(const ch of s){ if(ch==="【"||ch==="】"){ if(buf) out.push([buf,red]); buf=""; red=ch==="【"; } else buf+=ch; } if(buf) out.push([buf,red]); return out; };
  function wrapLine(ctx,s,maxW){ // 赤の印を保ったまま折り返す
    const noHead="、。，．・ー〜！？!?）」』…ぁぃぅぇぉゃゅょっ"; const lines=[]; let cur=[]; let w=0;
    for(const [txt,red] of parts(s)) for(const ch of txt){ const cw=ctx.measureText(ch).width; if(w+cw>maxW && cur.length && !noHead.includes(ch)){ lines.push(cur); cur=[]; w=0; } cur.push([ch,red]); w+=cw; }
    if(cur.length) lines.push(cur); return lines;
  }
  function drawRich(ctx,line,cx,y,col,alphaChars){ // 1文字ずつ（タイプ）
    const total=line.reduce((a,[c])=>a+ctx.measureText(c).width,0); let x=cx-total/2;
    line.forEach(([c,red],i)=>{ if(i>=alphaChars) return; ctx.fillStyle=red?C.red:col; ctx.fillText(c,x,y); x+=ctx.measureText(c).width; });
  }
  function darkBg(ctx,t){ ctx.fillStyle="#0e0a08"; ctx.fillRect(0,0,W,H);
    const g=ctx.createRadialGradient(W*.46,H*.48,100,W*.46,H*.48,1100); g.addColorStop(0,"rgba(60,44,34,.55)"); g.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=.6+.4*Math.sin(t*20); ctx.drawImage(grain,(t*37%7)-3,(t*53%7)-3,W,H); ctx.globalAlpha=1; }

  function renderText(ctx,c,t){
    darkBg(ctx,t);
    ctx.font=font(900,68); ctx.textBaseline="middle";
    const raw=(c.lines||"").split("\n").filter(x=>x.trim()); let all=[]; raw.forEach(l=>{ all=all.concat(wrapLine(ctx,l,880)); all.push(null); }); all.pop();
    const lh=104; let y=H*0.47-(all.length-1)*lh/2; let start=0.2;
    for(const line of all){ if(!line){ y+=lh*0.5; start+=0.25; continue; }
      const n=line.length, chars=Math.floor(clamp((t-start)/(n*0.055))*n);
      drawRich(ctx,line,W*0.46,y,C.cream,chars); y+=lh; start+=n*0.055+0.15; }
    if(c.source){ ctx.globalAlpha=ease(prog(t,start,0.4)); ctx.font=font(700,32); ctx.fillStyle=C.dim; ctx.textAlign="center"; ctx.fillText(c.source,W*0.46,y+60); ctx.textAlign="left"; ctx.globalAlpha=1; }
  }
  function renderQuote(ctx,c,t){
    darkBg(ctx,t);
    ctx.textBaseline="middle"; ctx.font=font(900,88,true);
    const raw=(c.quote||"").split("\n"); let all=[]; raw.forEach(l=>all=all.concat(wrapLine(ctx,l,860)));
    const lh=130, top=H*0.45-(all.length-1)*lh/2;
    // 大きなかぎかっこ
    ctx.globalAlpha=ease(prog(t,0,0.6))*0.35; ctx.fillStyle=C.cream; ctx.font=font(900,240,true); ctx.fillText("「",60,top-120); ctx.textAlign="right"; ctx.fillText("」",W-120,top+(all.length-1)*lh+140); ctx.textAlign="left"; ctx.globalAlpha=1;
    ctx.font=font(900,88,true);
    all.forEach((line,i)=>{ const a=ease(prog(t,0.3+i*0.5,0.8)); ctx.globalAlpha=a; ctx.save(); ctx.translate(0,(1-a)*24); drawRich(ctx,line,W*0.46,top+i*lh,C.cream,1e9); ctx.restore(); });
    ctx.globalAlpha=ease(prog(t,0.6+all.length*0.5,0.6)); ctx.textAlign="center";
    ctx.font=font(700,40); ctx.fillStyle=C.cream; ctx.fillText("— "+(c.who||""),W*0.46,top+(all.length-1)*lh+150);
    ctx.font=font(700,28); ctx.fillStyle=C.dim; ctx.fillText(c.qsrc||"",W*0.46,top+(all.length-1)*lh+205);
    ctx.textAlign="left"; ctx.globalAlpha=1;
  }
  function renderRx(ctx,c,t){
    ctx.drawImage(paper,0,0); const L=40,R=1040; ctx.textBaseline="middle";
    ctx.globalAlpha=ease(prog(t,0,0.3)); ctx.fillStyle=C.ink; ctx.font=font(900,112,true); ctx.fillText("処 方 箋",L,150);
    ctx.fillStyle=C.brown; ctx.font=font(700,34); ctx.fillText("CINEMA HOLIC 映画処方所",L+4,240);
    ctx.textAlign="right"; ctx.font=font(700,38); ctx.fillText("No. "+(c.no||"001"),R,140); ctx.fillText("患者："+(c.patient||"そこの君"),R,205); ctx.textAlign="left";
    ctx.fillStyle=C.ink; ctx.fillRect(L,287,R-L,6); ctx.fillRect(L,300,R-L,3); ctx.globalAlpha=1;
    const rows=[["今週の処方",c.title],["用量",c.dose],["副作用",c.side]];
    let y=380;
    rows.forEach(([k,v],i)=>{ const p=ease(prog(t,0.35+i*0.45,0.4)); ctx.globalAlpha=p; const dx=(1-p)*40;
      ctx.fillStyle=C.brown; ctx.font=font(700,34); ctx.fillText(k,L+20+dx,y+30);
      ctx.fillStyle=C.ink; ctx.font=font(900,i===0?84:66); const lines=wrapLine(ctx,v||"",R-L-60);
      lines.forEach((ln,j)=>{ ctx.textAlign="left"; let x=L+20+dx; ln.forEach(([ch])=>{ ctx.fillText(ch,x,y+110+j*(i===0?100:82)); x+=ctx.measureText(ch).width; }); });
      y+=110+lines.length*(i===0?100:82)+20; ctx.fillStyle=C.line; ctx.fillRect(L,y,R-L,3); y+=40; ctx.globalAlpha=1; });
    // はんこ
    const sp=prog(t,1.8,0.22); if(sp>0){ const cx=R-150, cy=y+40, sc=1+1.2*(1-ease(sp));
      ctx.save(); ctx.globalAlpha=clamp(sp*2)*.95; ctx.translate(cx,cy); ctx.rotate(-14*Math.PI/180); ctx.scale(sc,sc);
      ctx.beginPath(); ctx.arc(0,0,110,0,7); ctx.lineWidth=12; ctx.strokeStyle=C.red; ctx.stroke(); ctx.fillStyle=C.red; ctx.textAlign="center"; ctx.font=font(900,70); ctx.fillText("処方",0,4); ctx.restore(); ctx.textAlign="left"; }
    // 白衣のじょんどぅー＋ひと言
    const dp=ease(prog(t,2.1,0.45));
    if(IM.doc&&dp>0){ const tw=560, s=tw/IM.doc.width, bob=Math.sin(t*2*Math.PI/1.6)*8, sq=1+0.01*Math.sin(t*2*Math.PI/1.6); ctx.drawImage(IM.doc,W-tw+40,1360+(1-dp)*500+bob,tw,IM.doc.height*s*sq); }
    const bp=prog(t,2.4,0.3);
    if(bp>0&&c.doc){ const bx0=L,by0=1400,bx1=W-560+90,by1=1600; ctx.save(); ctx.globalAlpha=clamp(bp*3);
      ctx.beginPath(); ctx.roundRect(bx0,by0,bx1-bx0,by1-by0,44); ctx.moveTo(bx1-12,by0+60); ctx.lineTo(bx1+60,by0+95); ctx.lineTo(bx1-12,by0+120);
      ctx.lineWidth=14; ctx.strokeStyle=C.ink; ctx.lineJoin="round"; ctx.stroke(); ctx.fillStyle="#fff"; ctx.fill();
      ctx.fillStyle=C.ink; ctx.font=font(900,46); ctx.textAlign="center"; const ls=wrapLine(ctx,c.doc,bx1-bx0-60);
      ls.forEach((ln,k)=>{ let s=ln.map(x=>x[0]).join(""); ctx.fillText(s,(bx0+bx1)/2,(by0+by1)/2+(k-(ls.length-1)/2)*60); }); ctx.restore(); ctx.textAlign="left"; }
  }
  function render(ctx,c,t){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.textAlign="left";
    // 画面を止めないように、ゆっくり寄り続ける（quality-bar：1.5秒以上止めない）
    const D=+c.dur||4, z=1+0.05*clamp(t/D);
    if(c.type!=="rx"){ ctx.translate(W*0.46,H*0.47); ctx.scale(z,z); ctx.translate(-W*0.46,-H*0.47); }
    if(c.type==="quote") renderQuote(ctx,c,t); else if(c.type==="rx") renderRx(ctx,c,t); else renderText(ctx,c,t); ctx.restore(); }
  function cues(c){ const d=+c.dur||4; if(c.type==="rx") return {duration:d,cues:[{t:1.8,sfx:"brand/stamp",note:"はんこ"}]};
    if(c.type==="text") return {duration:d,cues:[{t:0.2,sfx:"sfx/typing",note:"タイプ音"}]}; return {duration:d,cues:[{t:0.1,sfx:"brand/low_hit",note:"低音"}]}; }
  return {render,ready,cues};
})();

const DEF={
  text:{type:"text",dur:5,lines:"監督の〇〇は\n【〇〇】だった",source:"（事実確認ずみの1行と出典）"},
  quote:{type:"quote",dur:6,quote:"ここに【名言】が入る",who:"〇〇",qsrc:"出典：〇〇（20XX）"},
  rx:{type:"rx",dur:5,no:"001",patient:"そこの君",title:"映画のタイトル",dose:"一人で、深夜に。",side:"〇〇したくなる。",doc:"…お大事に。"}
};
const KEY="cinemaholic-card-maker-v1";
let store; try{ store=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
if(!store) store={cur:"text",cards:JSON.parse(JSON.stringify(DEF))};
let cfg=store.cards[store.cur];
const cv=document.getElementById("cv"), ctx=cv.getContext("2d"), $=id=>document.getElementById(id); let playing=false;
const FIELDS={dur:"dur",lines:"lines",source:"source",quote:"quote",who:"who",qsrc:"qsrc",no:"no",patient:"patient",title:"title",dose:"dose",side:"side",doc:"doc"};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} $("json").value=JSON.stringify(cfg,null,2); }
function still(){ CM.render(ctx,cfg,+cfg.dur||4); }
function changed(){ save(); if(!playing) still(); }
function sync(){ document.body.dataset.type=cfg.type; document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===cfg.type));
  for(const [id,k] of Object.entries(FIELDS)){ const el=$(id); el.value=cfg[k]??""; el.oninput=()=>{ cfg[k]=el.type==="number"?parseFloat(el.value)||4:el.value; changed(); }; } }
function play(){ playing=true; $("btnPlay").textContent="■ 止める"; const st=performance.now(), D=+cfg.dur||4;
  const step=now=>{ if(!playing) return; const t=(now-st)/1000; CM.render(ctx,cfg,Math.min(t,D)); if(t<D+0.3) requestAnimationFrame(step); else { playing=false; $("btnPlay").textContent="▶ 再生"; } }; requestAnimationFrame(step); }
async function recordVideo(){ const types=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"]; const type=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!type){ $("status").textContent="このブラウザは動画の保存に対応していません"; return; }
  const rec=new MediaRecorder(cv.captureStream(30),{mimeType:type,videoBitsPerSecond:12e6}); const ch=[]; rec.ondataavailable=e=>e.data.size&&ch.push(e.data); rec.start(); playing=false;
  const D=+cfg.dur||4, st=performance.now(); await new Promise(res=>{ const step=now=>{ const t=(now-st)/1000; CM.render(ctx,cfg,Math.min(t,D)); if(t<D+0.1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
  rec.stop(); await new Promise(r=>rec.onstop=r); const ext=type.includes("mp4")?"mp4":"webm"; const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(ch,{type:type.split(";")[0]})); a.download=cfg.type+"."+ext; a.click(); }
function bind(){
  document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{ store.cur=b.dataset.t; cfg=store.cards[store.cur]; sync(); changed(); });
  $("btnPlay").onclick=()=>playing?(playing=false,$("btnPlay").textContent="▶ 再生",still()):play();
  $("btnVideo").onclick=recordVideo;
  $("btnPng").onclick=()=>{ still(); const a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download=cfg.type+".png"; a.click(); };
  $("btnCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText($("json").value); $("status").textContent="コピーしました"; }catch(e){ $("json").select(); } };
  $("btnLoad").onclick=()=>{ try{ const c=JSON.parse($("json").value); if(!DEF[c.type]) throw 0; store.cur=c.type; store.cards[c.type]=Object.assign({},DEF[c.type],c); cfg=store.cards[c.type]; sync(); changed(); }catch(e){ $("status").textContent="JSONの形が正しくありません"; } };
  $("btnReset").onclick=()=>{ store.cards[store.cur]=JSON.parse(JSON.stringify(DEF[store.cur])); cfg=store.cards[store.cur]; sync(); changed(); };
}
window.loadCfg=async c=>{ cfg=Object.assign({},DEF[c.type||"text"],c); await CM.ready(); return CM.cues(cfg); };
window.frameAt=t=>{ CM.render(ctx,cfg,t); return cv.toDataURL("image/jpeg",0.95); };
(async()=>{ await CM.ready(); if(new URLSearchParams(location.search).has("headless")){ document.body.classList.add("headless"); window.__ready=true; return; }
  sync(); bind(); save(); still(); setTimeout(play,300); })();
</script>
</body>
</html>
