<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>映画紹介メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f150f;--night:#1b1511;--night2:#2c221b;--night3:#3d3026;--cream:#f0e4cc;--dim:#b0a088;--parka:#b0422e;--gold:#c9a35a;--green:#4a6e58;
--font:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--cream);font-family:var(--font);overflow-x:hidden}
body.headless{background:#000}
body.headless .ui{display:none}
body.headless canvas{width:1080px!important;height:1920px!important;border:0;border-radius:0;box-shadow:none}
.app{display:grid;grid-template-columns:minmax(260px,420px) minmax(0,1fr);gap:24px;padding:20px;max-width:1200px;margin:0 auto}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr);padding:12px 16px}}
.app>*{min-width:0}
.stage{position:sticky;top:12px;align-self:start;text-align:center}
@media (max-width:820px){.stage{position:static}}
canvas{width:100%;max-width:420px;aspect-ratio:9/16;height:auto;border:3px solid var(--ink);border-radius:18px;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@media (max-width:820px){canvas{max-width:300px}}
.play{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
h1{font-size:20px;margin:0 0 4px;font-weight:900}
h1 small{display:block;font-size:12px;color:var(--dim);font-weight:700}
.card{background:var(--night2);border:2px solid var(--ink);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:14px;margin:0 0 10px;color:var(--gold)}
label{font-size:12px;color:var(--dim);display:block;margin:8px 0 4px}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--night);color:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:16px}
textarea{min-height:70px}
textarea.json{min-height:120px;font-size:13px;font-family:ui-monospace,monospace}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{background:var(--night3);color:var(--cream);border:2px solid var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
button.main{background:var(--parka)}
button.ghost{background:transparent}
.svc{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.svc select{flex:1;min-width:0}
.svc select.type{flex:none;width:110px}
.svc button{padding:8px 10px;flex:none}
.note{font-size:12px;color:var(--dim);line-height:1.6}
.status{font-size:13px;color:var(--gold);min-height:1.4em;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input[type=range]{width:100%}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div class="play ui">
      <button class="main" id="btnPlay">▶ 再生</button>
      <button id="btnVideo">動画で保存</button>
      <button id="btnPng">画像で保存</button>
    </div>
    <div class="status ui" id="status"></div>
  </div>

  <div class="ui">
    <h1>映画紹介メーカー<small>処方箋ふうの映画紹介の画面。入力すると、その場で画面が変わります</small></h1>

    <div class="card">
      <h2>処方箋の見出し</h2>
      <div class="grid2">
        <div><label>No.</label><input type="text" id="no"></div>
        <div><label>患者</label><input type="text" id="patient"></div>
      </div>
    </div>

    <div class="card">
      <h2>お薬（映画）</h2>
      <label>タイトル</label><input type="text" id="title">
      <div class="grid3">
        <div><label>監督</label><input type="text" id="director"></div>
        <div><label>公開年</label><input type="number" id="year"></div>
        <div><label>上映時間（分）</label><input type="number" id="runtime"></div>
      </div>
      <label>効きめ（ひと言。あらすじではなく、どんな気持ちになる映画か）</label><textarea id="one"></textarea>
    </div>

    <div class="card">
      <h2>ポスター</h2>
      <input type="file" id="posterFile" accept="image/*">
      <div class="grid2">
        <div><label>大きさ</label><input type="range" id="pScale" min="1" max="2" step="0.01"></div>
        <div><label>上下</label><input type="range" id="pY" min="-0.5" max="0.5" step="0.01"></div>
      </div>
      <div class="row"><button class="ghost" id="posterClear">ポスターを外す</button></div>
      <p class="note">選んだ画像はこの端末にだけ保存されます。オリジナルの絵か、権利を確認した画像を使ってください。</p>
    </div>

    <div class="card">
      <h2>もらえる薬局（配信）</h2>
      <div id="svcs"></div>
      <button class="ghost" id="addSvc" style="width:100%">＋ サービスを追加</button>
      <label>情報の時点</label><input type="text" id="asof" placeholder="2026年9月">
      <p class="note">見放題が先に並びます。最大6つ表示し、残りは「ほか〇」になります。アイコンは下で差し替えられます。</p>
      <details><summary class="note" style="cursor:pointer">アイコン画像を差し替える</summary>
        <div id="iconUp"></div>
      </details>
    </div>

    <div class="card">
      <h2>じょんどぅーのひと言</h2>
      <textarea id="bubble"></textarea>
    </div>

    <div class="card">
      <h2>保存・読み込み（制作パイプライン用）</h2>
      <p class="note">各話の <code>movie.json</code> と同じ形です。Claude が作った movie.json を貼って読み込むこともできます。</p>
      <textarea class="json" id="json"></textarea>
      <div class="row">
        <button id="btnCopy">JSONをコピー</button>
        <button id="btnLoad">上のJSONを読み込む</button>
        <button class="ghost" id="btnReset">初期状態に戻す</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ 描画エンジン（プレビュー・動画保存・自動書き出しで共通） ============ */
const MC = (() => {
  const W = 1080, H = 1920;
  const C = {ink:"#1f150f", paper:"#f4ecd6", paper2:"#e2d6ba", line:"#d6c8aa", brown:"#786048", red:"#c4462f", green:"#4a6e58", white:"#ffffff"};
  const SANS = '"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans",sans-serif';
  const SERIF = '"Noto Serif JP","Noto Serif CJK JP","Hiragino Mincho ProN",serif';
  const font = (w, px, serif) => `${w} ${px}px ${serif ? SERIF : SANS}`;
  const SERVICES = {
    "Netflix":["netflix","#141414","#e50914","NETFLIX"], "U-NEXT":["unext","#000000","#ffffff","U-NEXT"],
    "WOWOWオンデマンド":["wowow","#002060","#ffffff","WOWOW"], "TELASA":["telasa","#f05a28","#ffffff","TELASA"],
    "Prime Video":["primevideo","#00a8e1","#ffffff","prime\nvideo"], "DMM TV":["dmmtv","#1e1e1e","#ffffff","DMM TV"],
    "Disney+":["disneyplus","#0a1e5a","#ffffff","Disney+"], "Hulu":["hulu","#1ce783","#141414","Hulu"],
    "ABEMA":["abema","#1e1e1e","#ffffff","ABEMA"], "Lemino":["lemino","#3c3c3c","#ffffff","Lemino"],
    "FOD":["fod","#e60012","#ffffff","FOD"], "J:COM STREAM":["jcom","#0050a0","#ffffff","J:COM"],
    "TSUTAYA DISCAS":["discas","#002878","#ffffff","DISCAS"], "music.jp":["musicjp","#e63c78","#ffffff","music.jp"],
    "Apple TV":["appletv","#111111","#ffffff","Apple TV"], "Rakuten TV":["rakutentv","#bf0000","#ffffff","Rakuten\nTV"]
  };
  const img = {};  // 読み込んだ画像
  let paper = null;

  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const prog=(t,s,d)=>clamp((t-s)/d);
  const ease=t=>1-Math.pow(1-clamp(t),3);
  const back=(t,s=1.7)=>{t=clamp(t)-1;return t*t*((s+1)*t+s)+1};

  function load(src){ return new Promise(r=>{ if(!src) return r(null); const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; }); }

  async function ready(cfg){
    img.doctor = await load("../../assets/characters/johndoe/doctor_stand.png");
    img.poster = await load(cfg.poster_data || (cfg.poster ? "../../"+cfg.poster : null));
    img.icons = {};
    const custom = cfg.icon_data || {};
    await Promise.all((cfg.streaming||[]).map(async s=>{
      const id=(SERVICES[s.service]||[s.service])[0];
      img.icons[s.service] = await load(custom[s.service] || `../../assets/ui/services/${id}.png`);
    }));
    try{ await document.fonts.load(font(900,60)); await document.fonts.load(font(900,60,true)); await document.fonts.ready; }catch(e){}
    if(!paper) paper = makePaper();
  }

  function makePaper(){
    const c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
    x.fillStyle=C.paper; x.fillRect(0,0,W,H);
    let s=5; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
    for(let i=0;i<9000;i++){ x.fillStyle=`rgba(120,100,70,${rnd()*0.05})`; x.fillRect(rnd()*W,rnd()*H,2+rnd()*3,2+rnd()*3); }
    return c;
  }

  function wrap(ctx, text, maxW){
    const noHead="、。，．・ー〜！？!?）」』…ぁぃぅぇぉゃゅょっァィゥェォャュョッ";
    const out=[]; let cur="";
    for(const ch of (text||"").replace(/\\n/g,"\n")){
      if(ch==="\n"){ out.push(cur); cur=""; continue; }
      if(ctx.measureText(cur+ch).width>maxW && cur && !noHead.includes(ch)){ out.push(cur); cur=ch; } else cur+=ch;
    }
    if(cur) out.push(cur); return out;
  }

  function icon(ctx, name, x, y, size){
    const i = img.icons && img.icons[name];
    ctx.save(); ctx.beginPath(); ctx.roundRect(x,y,size,size,22); ctx.clip();
    if(i){ ctx.drawImage(i,x,y,size,size); }
    else{
      const [,bg,fg,label]=SERVICES[name]||["","#505050","#ffffff",name];
      ctx.fillStyle=bg; ctx.fillRect(x,y,size,size);
      const lines=label.split("\n"); let fs=34;
      ctx.font=font(900,fs); while(Math.max(...lines.map(l=>ctx.measureText(l).width))>size*0.82&&fs>12){fs--;ctx.font=font(900,fs);}
      ctx.fillStyle=fg; ctx.textAlign="center"; ctx.textBaseline="middle";
      lines.forEach((l,k)=>ctx.fillText(l,x+size/2,y+size/2+(k-(lines.length-1)/2)*fs*1.05));
    }
    ctx.restore();
    ctx.beginPath(); ctx.roundRect(x,y,size,size,22); ctx.lineWidth=3; ctx.strokeStyle=C.ink; ctx.stroke();
  }

  // 出てくる順番（秒）
  const T = {head:0.0, poster:0.15, info:0.45, icons:0.9, stamp:1.5, doc:1.65, bubble:2.0, end:4.0};

  function render(ctx, cfg, t){
    if(t==null) t=T.end;
    const L=40, R=1040;
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.drawImage(paper,0,0);
    ctx.textBaseline="alphabetic"; ctx.textAlign="left";
    // 見出し
    let a=ease(prog(t,T.head,0.3)); ctx.globalAlpha=a;
    ctx.fillStyle=C.ink; ctx.font=font(900,112,true); ctx.textBaseline="middle"; ctx.fillText("処 方 箋",L,150);
    ctx.fillStyle=C.brown; ctx.font=font(700,34); ctx.fillText("CINEMA HOLIC 映画処方所",L+4,240);
    ctx.textAlign="right"; ctx.font=font(700,38); ctx.fillText("No. "+(cfg.no||"001"),R,140); ctx.fillText("患者："+(cfg.patient||"そこの君"),R,205);
    ctx.textAlign="left"; ctx.fillStyle=C.ink; ctx.fillRect(L,287,(R-L)*ease(prog(t,0.1,0.4)),6); ctx.fillRect(L,300,(R-L)*ease(prog(t,0.15,0.4)),3);
    ctx.globalAlpha=1;
    // ポスター
    const px=L, py=350, pw=620, ph=930;
    const pa=ease(prog(t,T.poster,0.45)); const pyy=py+(1-pa)*120;
    if(pa>0){
      ctx.globalAlpha=pa;
      ctx.fillStyle="rgba(0,0,0,.18)"; ctx.fillRect(px+14,pyy+18,pw,ph);
      ctx.save(); ctx.beginPath(); ctx.rect(px,pyy,pw,ph); ctx.clip();
      if(img.poster){
        const sc=Math.max(pw/img.poster.width, ph/img.poster.height)*(cfg.poster_scale||1);
        const w=img.poster.width*sc, h=img.poster.height*sc;
        ctx.drawImage(img.poster, px+(pw-w)/2, pyy+(ph-h)/2+(cfg.poster_y||0)*ph, w, h);
      } else {
        ctx.fillStyle="#382c24"; ctx.fillRect(px,pyy,pw,ph);
        ctx.strokeStyle="#42342a"; ctx.lineWidth=10; for(let i=0;i<pw+ph;i+=26){ ctx.beginPath(); ctx.moveTo(px+i,pyy); ctx.lineTo(px+i-ph,pyy+ph); ctx.stroke(); }
        ctx.fillStyle="#d6c8aa"; ctx.textAlign="center"; ctx.font=font(900,52); ctx.fillText("ポスター",px+pw/2,pyy+ph/2-20);
        ctx.font=font(700,26); ctx.fillStyle="#b0a088"; ctx.fillText("（画像を選んでください）",px+pw/2,pyy+ph/2+40); ctx.textAlign="left";
      }
      ctx.restore();
      ctx.lineWidth=7; ctx.strokeStyle=C.ink; ctx.strokeRect(px,pyy,pw,ph);
      ctx.fillStyle="rgba(232,220,170,.9)"; ctx.fillRect(px+50,pyy-26,90,50); ctx.fillRect(px+pw-140,pyy-26,90,50);
      ctx.globalAlpha=1;
    }
    // 右の紹介
    const rx=px+pw+34, rw=R-rx;
    const ia=ease(prog(t,T.info,0.4)); ctx.globalAlpha=ia; const sx=(1-ia)*40;
    let y=352; ctx.textBaseline="top";
    ctx.fillStyle=C.brown; ctx.font=font(700,28); ctx.fillText("お薬の名前",rx+sx,y); y+=46;
    ctx.font=font(900,64); ctx.fillStyle=C.ink; for(const ln of wrap(ctx,cfg.title,rw)){ ctx.fillText(ln,rx+sx,y); y+=78; }
    y+=8; ctx.font=font(700,30); ctx.fillStyle=C.brown;
    const meta=[]; if(cfg.year) meta.push(cfg.year+"年"); if(cfg.runtime_min) meta.push(cfg.runtime_min+"分");
    ctx.fillText(meta.join("／"),rx+sx,y); y+=42;
    for(const ln of wrap(ctx,"監督："+(cfg.director||""),rw)){ ctx.fillText(ln,rx+sx,y); y+=42; }
    y+=20; ctx.fillStyle=C.line; ctx.fillRect(rx,y,rw,3); y+=24;
    ctx.fillStyle=C.brown; ctx.font=font(700,28); ctx.fillText("効きめ",rx+sx,y); y+=46;
    ctx.font=font(900,40); ctx.fillStyle=C.ink; for(const ln of wrap(ctx,cfg.one_liner,rw)){ ctx.fillText(ln,rx+sx,y); y+=54; }
    y+=18; ctx.fillStyle=C.line; ctx.fillRect(rx,y,rw,3); y+=24;
    ctx.fillStyle=C.brown; ctx.font=font(700,28); ctx.fillText("もらえる薬局",rx+sx,y); y+=50;
    ctx.globalAlpha=1;
    // アイコン
    const list=[...(cfg.streaming||[])].sort((p,q)=>(p.type.includes("見放題")?0:1)-(q.type.includes("見放題")?0:1));
    const gap=16, size=Math.floor((rw-gap*2)/3);
    list.slice(0,6).forEach((s,i)=>{
      const p=prog(t,T.icons+i*0.08,0.3); if(p<=0) return;
      const cx=rx+(i%3)*(size+gap), cy=y+Math.floor(i/3)*(size+42);
      const sc=0.5+0.5*back(p);
      ctx.save(); ctx.globalAlpha=clamp(p*3); ctx.translate(cx+size/2,cy+size/2); ctx.scale(sc,sc); ctx.translate(-(cx+size/2),-(cy+size/2));
      icon(ctx,s.service,cx,cy,size); ctx.restore();
      ctx.globalAlpha=clamp(p*3); ctx.textAlign="center"; ctx.font=font(700,22); const free=s.type.includes("見放題");
      ctx.fillStyle=free?C.green:C.brown; ctx.fillText(free?"見放題":"レンタル",cx+size/2,cy+size+5); ctx.textAlign="left"; ctx.globalAlpha=1;
    });
    y+=2*(size+42)+6;
    ctx.globalAlpha=ease(prog(t,T.icons+0.5,0.3)); ctx.font=font(700,22); ctx.fillStyle=C.brown;
    const rest=list.length-6; ctx.fillText((rest>0?`ほか${rest}　`:"")+(cfg.streaming_as_of?String(cfg.streaming_as_of).split("（")[0]+"時点":""),rx,y);
    ctx.globalAlpha=1;
    // はんこ（ドンと押す）
    const sp=prog(t,T.stamp,0.22);
    if(sp>0){
      const cx=px+pw-100, cy=py+ph-105, sc=1+1.2*(1-ease(sp));
      ctx.save(); ctx.globalAlpha=clamp(sp*2)*0.95; ctx.translate(cx,cy); ctx.rotate(-14*Math.PI/180); ctx.scale(sc,sc);
      ctx.beginPath(); ctx.arc(0,0,98,0,Math.PI*2); ctx.lineWidth=11; ctx.strokeStyle=C.red; ctx.stroke();
      ctx.fillStyle=C.red; ctx.font=font(900,62); ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("処方",0,4);
      ctx.restore();
    }
    // 白衣のじょんどぅー（下からせり上がる）
    const dp=ease(prog(t,T.doc,0.45));
    if(img.doctor && dp>0){
      const tw=600, s=tw/img.doctor.width, th=img.doctor.height*s;
      const dx=W-tw+30, dy=1330+(1-dp)*500+Math.sin(t*2*Math.PI/1.6)*8;
      ctx.drawImage(img.doctor,dx,dy,tw,th*(1+0.01*Math.sin(t*2*Math.PI/1.6)));
    }
    // ふきだし
    const bp=prog(t,T.bubble,0.3);
    if(bp>0 && cfg.bubble){
      const bx0=L, by0=1350, bx1=W-600+70, by1=1580, s=0.5+0.5*back(bp);
      ctx.save(); ctx.globalAlpha=clamp(bp*3); ctx.translate(bx1,by0+110); ctx.scale(s,s); ctx.translate(-bx1,-(by0+110));
      ctx.beginPath(); ctx.roundRect(bx0,by0,bx1-bx0,by1-by0,48);
      ctx.moveTo(bx1-12,by0+70); ctx.lineTo(bx1+70,by0+110); ctx.lineTo(bx1-12,by0+130);
      ctx.lineWidth=14; ctx.strokeStyle=C.ink; ctx.lineJoin="round"; ctx.stroke(); ctx.fillStyle=C.white; ctx.fill();
      ctx.fillStyle=C.ink; ctx.font=font(900,50); ctx.textAlign="center"; ctx.textBaseline="middle";
      const lines=wrap(ctx,cfg.bubble,bx1-bx0-60); const lh=66;
      lines.forEach((l,k)=>ctx.fillText(l,(bx0+bx1)/2,(by0+by1)/2+(k-(lines.length-1)/2)*lh));
      ctx.restore();
    }
    ctx.restore();
  }
  function cues(){ return {duration:T.end, cues:[{t:T.stamp,sfx:"brand/stamp",note:"はんこ"},{t:T.icons,sfx:"sfx/pop",note:"アイコン"}]}; }
  return {W,H,render,ready,cues,SERVICES,T};
})();

/* ============ 編集UI ============ */
const DEFAULT = {
  no:"001", patient:"そこの君",
  title:"映画のタイトル", year:2000, runtime_min:120, director:"監督の名前",
  one_liner:"どんな気持ちになる映画かを、ひと言で。",
  streaming:[{service:"Netflix",type:"見放題"},{service:"U-NEXT",type:"見放題"},{service:"Prime Video",type:"レンタル"}],
  streaming_as_of:"2026年10月",
  bubble:"…一人で、深夜に。\nよく効くよ。",
  poster:null, poster_scale:1, poster_y:0
};
const KEY="cinemaholic-movie-card-v1";
let cfg; try{ cfg=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
if(!cfg) cfg=JSON.parse(JSON.stringify(DEFAULT));
const cv=document.getElementById("cv"), ctx=cv.getContext("2d"), $=id=>document.getElementById(id);
let playing=false;

function exportCfg(){ const c=JSON.parse(JSON.stringify(cfg)); delete c.poster_data; delete c.icon_data; return c; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(cfg)); }catch(e){ try{ const c=JSON.parse(JSON.stringify(cfg)); delete c.poster_data; localStorage.setItem(KEY,JSON.stringify(c)); }catch(_){} } $("json").value=JSON.stringify(exportCfg(),null,2); }
function still(){ MC.render(ctx,cfg,MC.T.end); }
async function changed(reload){ if(reload) await MC.ready(cfg); save(); if(!playing) still(); }

function bindText(id,key,num){ $(id).value=cfg[key]??""; $(id).oninput=e=>{ cfg[key]=num?(parseInt(e.target.value)||null):e.target.value; changed(); }; }

function renderSvcs(){
  const box=$("svcs"); box.innerHTML="";
  const names=Object.keys(MC.SERVICES);
  cfg.streaming.forEach((s,i)=>{
    const d=document.createElement("div"); d.className="svc";
    d.innerHTML=`<select class="name">${names.map(n=>`<option>${n}</option>`).join("")}</select>
      <select class="type"><option>見放題</option><option>レンタル</option><option>見放題・レンタル</option><option>宅配レンタル</option></select>
      <button>✕</button>`;
    const [n,ty]=d.querySelectorAll("select");
    if(!names.includes(s.service)){ const o=document.createElement("option"); o.text=s.service; n.add(o); }
    n.value=s.service; ty.value=[...ty.options].some(o=>o.value===s.type)?s.type:(s.type.includes("見放題")?"見放題":"レンタル");
    n.onchange=()=>{ s.service=n.value; changed(true); renderIconUp(); };
    ty.onchange=()=>{ s.type=ty.value; changed(); };
    d.querySelector("button").onclick=()=>{ cfg.streaming.splice(i,1); renderSvcs(); changed(true); renderIconUp(); };
    box.appendChild(d);
  });
}
function renderIconUp(){
  const box=$("iconUp"); box.innerHTML="";
  cfg.streaming.forEach(s=>{
    const d=document.createElement("div"); d.innerHTML=`<label>${s.service}</label><input type="file" accept="image/*">`;
    d.querySelector("input").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
      r.onload=()=>{ (cfg.icon_data=cfg.icon_data||{})[s.service]=r.result; changed(true); }; r.readAsDataURL(f); };
    box.appendChild(d);
  });
}
function sync(){
  bindText("no","no"); bindText("patient","patient"); bindText("title","title"); bindText("director","director");
  bindText("year","year",true); bindText("runtime","runtime_min",true); bindText("one","one_liner"); bindText("asof","streaming_as_of"); bindText("bubble","bubble");
  $("pScale").value=cfg.poster_scale||1; $("pY").value=cfg.poster_y||0;
  renderSvcs(); renderIconUp();
}
function play(){
  playing=true; $("btnPlay").textContent="■ 止める"; const st=performance.now();
  const step=now=>{ if(!playing) return; const t=(now-st)/1000; MC.render(ctx,cfg,Math.min(t,MC.T.end)); if(t<MC.T.end+0.5) requestAnimationFrame(step); else { playing=false; $("btnPlay").textContent="▶ 再生"; } };
  requestAnimationFrame(step);
}
async function recordVideo(){
  const types=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"];
  const type=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!type){ $("status").textContent="このブラウザは動画の保存に対応していません"; return; }
  const rec=new MediaRecorder(cv.captureStream(30),{mimeType:type,videoBitsPerSecond:12e6}); const chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data); rec.start(); playing=false;
  $("status").textContent="録画中…";
  const st=performance.now();
  await new Promise(res=>{ const step=now=>{ const t=(now-st)/1000; MC.render(ctx,cfg,Math.min(t,MC.T.end)); if(t<MC.T.end+0.15) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
  rec.stop(); await new Promise(r=>rec.onstop=r);
  const ext=type.includes("mp4")?"mp4":"webm"; const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(chunks,{type:type.split(";")[0]})); a.download="movie_card."+ext; a.click();
  $("status").textContent="保存しました（"+ext+"）";
}
function bind(){
  $("pScale").oninput=e=>{ cfg.poster_scale=parseFloat(e.target.value); changed(); };
  $("pY").oninput=e=>{ cfg.poster_y=parseFloat(e.target.value); changed(); };
  $("posterFile").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ cfg.poster_data=r.result; changed(true); }; r.readAsDataURL(f); };
  $("posterClear").onclick=()=>{ delete cfg.poster_data; cfg.poster=null; changed(true); };
  $("addSvc").onclick=()=>{ cfg.streaming.push({service:"Netflix",type:"見放題"}); renderSvcs(); renderIconUp(); changed(true); };
  $("btnPlay").onclick=()=>playing?(playing=false,$("btnPlay").textContent="▶ 再生",still()):play();
  $("btnVideo").onclick=recordVideo;
  $("btnPng").onclick=()=>{ still(); const a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download="movie_card.png"; a.click(); };
  $("btnCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText($("json").value); $("status").textContent="JSONをコピーしました"; }catch(e){ $("json").select(); } };
  $("btnLoad").onclick=async()=>{ try{ const c=JSON.parse($("json").value); const keep={poster_data:cfg.poster_data,icon_data:cfg.icon_data};
      cfg=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),c,keep); await MC.ready(cfg); sync(); changed(); $("status").textContent="読み込みました"; }
    catch(e){ $("status").textContent="JSONの形が正しくありません"; } };
  $("btnReset").onclick=async()=>{ cfg=JSON.parse(JSON.stringify(DEFAULT)); await MC.ready(cfg); sync(); changed(); };
}

/* 自動書き出し用 */
window.MC=MC;
// "speed": 1.6 のようにすると、同じ動きを速く（短く）再生する（構成v2では2.5秒）
window.loadCfg=async c=>{ cfg=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),c); await MC.ready(cfg); const r=MC.cues(), k=+cfg.speed||1;
  return {duration:r.duration/k, cues:r.cues.map(x=>({...x,t:x.t/k}))}; };
window.frameAt=(t,q)=>{ MC.render(ctx,cfg,Math.min(MC.T.end,t*(+cfg.speed||1))); return q&&q<0.9?cv.toDataURL("image/jpeg",q):cv.toDataURL("image/png"); };

(async()=>{
  if(new URLSearchParams(location.search).has("headless")){ document.body.classList.add("headless"); await MC.ready({}); window.__ready=true; return; }
  await MC.ready(cfg); sync(); bind(); save(); still(); setTimeout(play,300);
})();
</script>
